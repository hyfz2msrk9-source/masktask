version: '3.8'

services:
  rag-api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app:delegated
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      # Dockerの中からMac本体の11434ポート(Ollama)に通信させる設定
      - OLLAMA_HOST=http://host.docker.internal:11434
volumes:
  chroma_data: