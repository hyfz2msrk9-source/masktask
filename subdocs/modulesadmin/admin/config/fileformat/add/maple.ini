;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Auth]
template = "common/json_empty.html"

[Session]
mode = start

[Token]
mode = check
name = FileformatToken

;[Convert]

[Validate]
list_type.required = "0,リスト種別を入力してください。"
list_type.numeric = "0,不正なパラメータが入力されています。"
format_name.required = "1,ファイル形式を入力してください。"

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoFileformat =

[Action]
Session = ref:Session
DtoFileformat = ref:DtoFileformat
MdbFileformat = ref:MdbFileformat
FileformatLogic = ref:FileformatLogic
DtoLog = ref:DtoLog
MdbLog = ref:MdbLog

[view]
success = "admin/config/fileformat/json_add.html"
input = "admin/config/fileformat/json_error.html"
invalidToken = "admin/config/fileformat/json_token.html"