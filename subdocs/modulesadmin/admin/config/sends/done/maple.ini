[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = SendsEditToken

[Convert]
send_mail_limit.trim =
file_send_limit.trim =
send_mail_limit.tohalf =
file_send_limit.tohalf =

[DIContainer]
filename=dicon.ini
[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups
token      = ref:Token

[View]
success    = admin/config/sends/done.html
input      = admin/config/sends/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html
