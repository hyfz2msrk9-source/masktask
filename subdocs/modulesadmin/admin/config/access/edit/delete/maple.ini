[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = AccessEditToken

;[Convert]

;[Validate]

[DIContainer]
filename=dicon.ini

[InjectSession]
DtoAccess =

[InjectRequest]
DtoAccess =

[Action]
session     = ref:Session
DtoConfigs  = ref:DtoConfigs
MdbConfigs  = ref:MdbConfigs
DtoAccess   = ref:DtoAccess
MdbAccess   = ref:MdbAccess
AccessDto   = ref:AccessDto
AccessLogic = ref:AccessLogic
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog

[View]
success    = admin/config/access/edit.html
invalidToken = admin/config/access/error.html
error = admin/config/error.html
