[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,remove
name = AccessCsvToken

[Convert]

[Validate]

[FileUpload]
name = file
maxsize     = 2097152
;type        = text/csv, application/octet-stream,text/x-comma-separated-values
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
;typeError   = カンマ区切りCSVファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
fileUpload = ref:FileUpload
DtoAccess    = ref:DtoAccess
AccessLogic  = ref:AccessLogic
MdbAccess    = ref:MdbAccess
AccessDto    = ref:AccessDto
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbConfigs = ref:MdbConfigs

[View]
success = "admin/config/access/csv/done.html"
upload  = "admin/config/access/csv/form.html"
invalidToken = "admin/config/access/csv/done.html"
error   = "admin/config/error.html"
