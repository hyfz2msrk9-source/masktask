[GlobalFilter]
ShareAuth =

[Session]
mode = start

[ShareAuth]
template = "admin/error.html"

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoFlexi =
DtoAdminUser =

[InjectRequest]
DtoGroups =

[Action]
session         = ref:Session
DtoGroups       = ref:DtoGroups
MdbGroups       = ref:MdbGroups
DtoFolder       = ref:DtoFolder
MdbFolder       = ref:MdbFolder
DtoAdminUser    = ref:DtoAdminUser
AdminUserLogic  = ref:AdminUserLogic
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog
GroupLogic      = ref:GroupLogic
MdbDownloadMailer = ref:MdbDownloadMailer
MdbUpload       = ref:MdbUpload
DtoUpload       = ref:DtoUpload
MdbCollect      = ref:MdbCollect
DtoCollect      = ref:DtoCollect
MdbMchoice      = ref:MdbMchoice
MdbDownload     = ref:MdbDownload
MdbDeliveryto = ref:MdbDeliveryto
MdbDeliveryfile = ref:MdbDeliveryfile

[View]
success = admin/config/share/log/index.html
error   = admin/config/share/none.html
