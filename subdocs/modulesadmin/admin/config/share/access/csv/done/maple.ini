[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = shareAccessCsvToken

[Convert]

[Validate]

[FileUpload]
name = file
maxsize     = 2097152
;type        = text/csv, application/octet-stream,text/x-comma-separated-values
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
;typeError   = カンマ区切りCSVファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoAdminUser =

[InjectRequest]
DtoGroupsaccesses =
DtoGroups =

[Action]
session             = ref:Session
fileUpload          = ref:FileUpload
DtoGroups           = ref:DtoGroups
MdbGroups           = ref:MdbGroups
DtoGroupsaccesses   = ref:DtoGroupsaccesses
MdbGroupsaccesses   = ref:MdbGroupsaccesses
GroupsaccessesLogic = ref:GroupsaccessesLogic
GroupsaccessesDto   = ref:GroupsaccessesDto
DtoLog              = ref:DtoLog
MdbLog              = ref:MdbLog
DtoAdminUser        = ref:DtoAdminUser
AdminUserLogic      = ref:AdminUserLogic

[View]
success      = "admin/config/share/access/csv/done.html"
upload       = "admin/config/share/access/csv/form.html"
invalidToken = "admin/config/share/access/csv/done.html"
error        = "admin/config/share/access/error.html"
