[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = ShareAccessEditToken

;[Convert]

;[Validate]

[DIContainer]
filename=dicon.ini

[InjectSession]
DtoGroupsaccesses =
DtoAdminUser      =

[InjectRequest]
DtoGroupsaccesses =
DtoGroups =

[Action]
session             = ref:Session
DtoGroups           = ref:DtoGroups
MdbGroups           = ref:MdbGroups
DtoGroupsaccesses   = ref:DtoGroupsaccesses
MdbGroupsaccesses   = ref:MdbGroupsaccesses
GroupsaccessesDto   = ref:GroupsaccessesDto
GroupsaccessesLogic = ref:GroupsaccessesLogic
DtoLog              = ref:DtoLog
MdbLog              = ref:MdbLog
DtoAdminUser        = ref:DtoAdminUser
AdminUserLogic      = ref:AdminUserLogic


[View]
success      = admin/config/share/access/edit.html
invalidToken = admin/config/share/access/error.html
error        = admin/config/share/access/error.html
input        = admin/config/share/access/edit.html
