[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = ShareAccessToken

[Convert]

[Validate]

[DIContainer]
filename = dicon.ini

[InjectSession]
groupDto     =
DtoAdminUser =

[InjectRequest]
groupDto =

[Action]
session          = ref:Session
DtoGroups        = ref:DtoGroups
MdbGroups        = ref:MdbGroups
groupDto         = ref:groupDto
DtoFolder        = ref:DtoFolder
MdbFolder        = ref:MdbFolder
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog
GroupLogic       = ref:GroupLogic
DtoAdminUser     = ref:DtoAdminUser
AdminUserLogic   = ref:AdminUserLogic

[View]
success      = admin/config/share/access/done.html
input        = admin/config/share/access/index.html
invalidToken = admin/config/share/access/index.html
error        = admin/config/share/access/error.html