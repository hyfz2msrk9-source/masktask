[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = GroupDelToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]
groupDto     =
DtoGroups    =
DtoAdminUser =

[InjectRequest]

[Action]
session         = ref:Session
DtoGroups       = ref:DtoGroups
MdbGroups       = ref:MdbGroups
MdbGroupsusers  = ref:MdbGroupsusers
DtoFolder       = ref:DtoFolder
MdbFolder       = ref:MdbFolder
MdbUpload       = ref:MdbUpload
MdbCollect      = ref:MdbCollect
GroupLogic      = ref:GroupLogic
groupDto        = ref:groupDto
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog
DtoGroupsadminusers = ref:DtoGroupsadminusers
MdbGroupsadminusers = ref:MdbGroupsadminusers
MdbGroupsAccess	    = ref:MdbGroupsAccess
DtoAdminUser    = ref:DtoAdminUser
AdminUserLogic  = ref:AdminUserLogic
MdbUser = ref:MdbUser

[View]
success  = admin/config/share/del_done.html
invalidToken = admin/config/share/del_done.html
error        = admin/config/share/error.html
