[GlobalFilter]

[Session]
mode = start

[Token]
mode = build
name = GroupEditToken

[Convert]
;name.trim =
;folder_name.trim =
;name.tohalf =
;folder_name.tohalf =
;cancel_span.tohalfnum =
;start_year.tohalfnum =
;start_month.tohalfnum =
;start_day.tohalfnum =
;end_year.tohalfnum =
;end_month.tohalfnum =
;end_day.tohalfnum =

[Validate]
;name.required = "1,グループ名を入力してください。"
;folder_name.required = "1,共有フォルダ名を入力してください。"
;name.maxlength = "1,グループ名を全角50文字以内で入力してください。,150"
;folder_name.maxlength = "1,共有フォルダ名を全角50文字以内で入力してください。,150"

;サブフォルダ設定画面から戻るときのため、actionでチェックする
;del_span.required = "1,定期削除の日数を入力してください。"
;del_span.match = "1,定期削除の日数は0日以上の半角数字を入力してください。,^[0-9]+$"
;del_span.minvalue = "1,定期削除の日数は0日以上を入力してください。,0"
;del_span.mbmaxlength = "1,定期削除の日数は99999日以下を入力してください。,5"

file_lock_option_flg,cancel_span.whichrequired = "1,ロック解除日数を入力してください。,1"
cancel_span.match = "1,ロック解除日数は0日以上の半角数字を入力してください。,^[0-9]+$"
cancel_span.minvalue = "1,ロック解除日数は0日以上を入力してください。,0"
cancel_span.mbmaxlength = "1,ロック解除日数は99999日以下を入力してください。,5"

[DIContainer]
filename = dicon.ini

[InjectSession]
groupDto =
DtoAdminUser =

[InjectRequest]
groupDto =

[Action]
session          = ref:Session
DtoGroups        = ref:DtoGroups
MdbGroups        = ref:MdbGroups
MdbGroups_users  = ref:MdbGroups_users
groupDto         = ref:groupDto
DtoFolder        = ref:DtoFolder
MdbFolder        = ref:MdbFolder
DtoUser          = ref:DtoUser
MdbUser          = ref:MdbUser
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog
MdbUpload        = ref:MdbUpload
DtoSection	 = ref:DtoSection
MdbSection	 = ref:MdbSection
DtoSectionusers	= ref:DtoSectionusers
MdbSectionusers	= ref:MdbSectionusers
DtoGroupsadminusers  = ref:DtoGroupsadminusers
MdbGroupsadminusers  = ref:MdbGroupsadminusers
GroupLogic	     = ref:GroupLogic
GroupsusersLogic     = ref:GroupsusersLogic
SectionLogic    = ref:SectionLogic
MdbMchoice      = ref:MdbMchoice
DtoAdminUser    = ref:DtoAdminUser
AdminUserLogic  = ref:AdminUserLogic
AdminUserDto	= ref:AdminUserDto
MdbAdminuser	= ref:MdbAdminuser
CommonList  = ref:CommonList

[View]
success      = admin/config/share/edit_user.html
over         = admin/config/share/over.html
input        = admin/config/share/edit.html
