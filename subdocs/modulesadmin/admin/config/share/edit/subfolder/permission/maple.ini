[GlobalFilter]

[Auth]
;stop = 1

[Session]
mode = start

[Token]
mode = make
name = PowerEditToken

[Convert]

[DIContainer]
filename =dicon.ini

[InjectSession]
DtoUser =
DtoGroups =
DtoFolder =
groupDto =

[InjectRequest]
groupDto =
DtoFolder =

[Action]
session        = ref:Session
DtoUser        = ref:DtoUser
MdbUser        = ref:MdbUser
DtoFolder      = ref:DtoFolder
MdbFolder      = ref:MdbFolder
DtoGroups      = ref:DtoGroups
MdbGroups      = ref:MdbGroups
ShareLogic     = ref:ShareLogic
MdbGroupsaccesses   = ref:MdbGroupsaccesses
MdbGroupsadminusers = ref:MdbGroupsadminusers
MdbSection     = ref:MdbSection
DtoSection     = ref:DtoSection
MdbGroupsusers = ref:MdbGroupsusers;
FolderDto      = ref:FolderDto;
FolderLogic    = ref:FolderLogic;
groupDto = ref:groupDto

[View]
success = "admin/config/share/subfolder/permission/index.html"
error   = "admin/config/share/subfolder/permission/error.html"
info    = "admin/config/share/subfolder/permission/info.html"
