[GlobalFilter]
ShareAuth =

[Session]
mode = start

[Token]
mode = make
name = UnlockToken

[ShareAuth]
template = "admin/error.html"

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoFlexi     =
DtoAdminUser =

[InjectRequest]
DtoFlexi =
DtoUpload = 

[Action]
session        = ref:Session
DtoUpload      = ref:DtoUpload
MdbUpload      = ref:MdbUpload
MdbFolder      = ref:MdbFolder
MdbGroups      = ref:MdbGroups
DtoGroups      = ref:DtoGroups
GroupDto       = ref:GroupDto
MdbUser        = ref:MdbUser
DtoAdminUser   = ref:DtoAdminUser
AdminUserLogic = ref:AdminUserLogic

[View]
success = admin/config/share/unlock.html
error   = admin/config/share/unlock_error.html
invalidToken = admin/config/share/unlock.html