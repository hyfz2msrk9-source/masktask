[GlobalFilter]
ShareAuth =

[Session]
mode = start

[Token]
mode = check,build
name = UnlockToken

[ShareAuth]
template = "admin/error.html"

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoFlexi     =
DtoAdminUser =

[InjectRequest]
DtoFlexi =
DtoUpload = 

[Action]
session        = ref:Session
DtoUpload      = ref:DtoUpload
MdbUpload      = ref:MdbUpload
MdbFolder      = ref:MdbFolder
MdbGroups      = ref:MdbGroups
DtoGroups      = ref:DtoGroups
GroupDto       = ref:GroupDto
MdbUser        = ref:MdbUser
DtoUser        = ref:DtoUser
MdbAdminUser   = ref:MdbAdminUser
DtoAdminUser   = ref:DtoAdminUser
DtoLog         = ref:DtoLog
MdbLog         = ref:MdbLog
AdminUserLogic = ref:AdminUserLogic

[View]
success      = admin/config/share/unlock_done.html
error        = admin/config/share/unlock_error.html
invalidToken = admin/config/share/unlock.html