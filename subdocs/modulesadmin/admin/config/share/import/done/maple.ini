[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = GroupImportToken

[Convert]

[FileUpload]
name = file
maxsize     = 2097152
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoGroups_users =
DtoGroups = 
DtoFolder =
DtoAdminUser =

[InjectRequest]

[Action]
session         = ref:Session
fileUpload      = ref:FileUpload
DtoGroups       = ref:DtoGroups
MdbGroups       = ref:MdbGroups
DtoFolder       = ref:DtoFolder
MdbFolder       = ref:MdbFolder
MdbGroups_users = ref:MdbGroups_users
DtoGroups_users = ref:DtoGroups_users
GroupLogic      = ref:GroupLogic
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser
DtoSection	= ref:DtoSection
MdbSection	= ref:MdbSection
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog
MdbUpload       = ref:MdbUpload
DtoAdminUser    = ref:DtoAdminUser
AdminUserLogic  = ref:AdminUserLogic
DtoGroupsAdminUsers = ref:DtoGroupsAdminUsers
MdbGroupsAdminUsers = ref:MdbGroupsAdminUsers

[View]
success      = admin/config/share/import_done.html
upload       = admin/config/share/import.html
invalidToken = admin/config/share/import_done.html
error        = admin/config/share/error2.html
