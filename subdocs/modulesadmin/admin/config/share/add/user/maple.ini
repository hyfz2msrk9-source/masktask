[GlobalFilter]

[Session]
mode = start

[Token]
mode = build
name = GroupAddToken

[Convert]
name.trim =
folder_name.trim =
;capacity.trim =
;name.toHalfspace =
;folder_name.toHalfspace =
name.tohalf =
folder_name.tohalf =
;cancel_span.tohalfnum =
start_year.tohalfnum =
start_month.tohalfnum =
start_day.tohalfnum =
end_year.tohalfnum =
end_month.tohalfnum =
end_day.tohalfnum =

[Validate]
name.required = "1,グループ名を入力してください。"
folder_name.required = "1,共有フォルダ名を入力してください。"
del_span_init.required = "1,定期削除の日数を入力してください。"
del_span_init.match = "1,定期削除の日数は0日以上の半角数字を入力してください。,^[0-9]+$"
del_span_init.minvalue = "1,定期削除の日数は0日以上を入力してください。,0"
del_span_init.mbmaxlength = "1,定期削除の日数は99999日以下を入力してください。,5"
file_lock_option_flg,cancel_span.whichrequired = "1,ロック解除日数を入力してください。,1"
cancel_span.match = "1,ロック解除日数は0日以上の半角数字を入力してください。,^[0-9]+$"
cancel_span.minvalue = "1,ロック解除日数は0日以上を入力してください。,0"
cancel_span.mbmaxlength = "1,ロック解除日数は99999日以下を入力してください。,5"
name.maxlength = "1,グループ名を全角50文字以内で入力してください。,150"
folder_name.maxlength = "1,共有フォルダ名を全角50文字以内で入力してください。,150"

[DIContainer]
filename = dicon.ini

[InjectSession]
groupDto =

[InjectRequest]
groupDto =

[Action]
session         = ref:Session
DtoGroups       = ref:DtoGroups
MdbGroups       = ref:MdbGroups
groupDto        = ref:groupDto
DtoFolder       = ref:DtoFolder
MdbFolder       = ref:MdbFolder
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser
DtoSection      = ref:DtoSection
MdbSection      = ref:MdbSection
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
MdbMchoice      = ref:MdbMchoice
CommonList  = ref:CommonList

[View]
success      = admin/config/share/add_user.html
over         = admin/config/share/over.html
input        = admin/config/share/add.html
error        = admin/config/share/error.html
