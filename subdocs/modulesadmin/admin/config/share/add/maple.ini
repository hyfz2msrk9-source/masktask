[GlobalFilter]

[Session]
mode = start

[Token]
mode = make
name = GroupAddToken

[Validate]
section_open_flg.maxvalue = "1,不正なパラメーターを検知しました。再度グループを追加してください。,1"
leader_open_flg.maxvalue = "1,不正なパラメーターを検知しました。再度グループを追加してください。,1"
user_open_flg.maxvalue = "1,不正なパラメーターを検知しました。再度グループを追加してください。,1"

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
groupDto =

[Action]
session         = ref:Session
DtoGroups       = ref:DtoGroups
MdbGroups       = ref:MdbGroups
MdbGroups_users = ref:MdbGroups_users
MdbUpload       = ref:MdbUpload
MdbConfigs      = ref:MdbConfigs
DtoConfigs      = ref:DtoConfigs
groupDto        = ref:groupDto
MdbMchoice      = ref:MdbMchoice
CommonList  = ref:CommonList

[View]
success  = admin/config/share/add.html
limit    = admin/config/share/limit.html
input    = admin/config/share/error.html
