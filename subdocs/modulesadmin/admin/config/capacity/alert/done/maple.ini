;[GlobalFilter]

;[AuthLevel]

[Session]
mode = start

[Token]

[Convert]
capacity_alert_notice.trim =
capacity_alert_notice.tohalf =

capacity_alert_notice_addr.trim =
capacity_alert_notice_addr.tohalf =
capacity_alert_notice_addr.tohalfspace =
[Validate]
capacity_alert_notice_addr.mbmaxlength = "1,メールアドレスを255文字以内で入力してください。,255"
capacity_alert_notice_addr.mails       = "1,メールアドレスを正しく入力してください。"

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session          = ref:Session
MdbConfigs       = ref:MdbConfigs
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog

[View]
success      = admin/config/capacity/alert/done.html
input        = admin/config/capacity/alert/index.html
error        = admin/config/error.html
