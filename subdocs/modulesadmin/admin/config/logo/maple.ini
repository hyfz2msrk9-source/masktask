[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = LogoEditToken

[Convert]

[DIContainer]

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
token = ref:Token

[View]
success    = admin/config/logo/index.html
error      = admin/config/error.html
error2      = admin/config/logo/error.html
