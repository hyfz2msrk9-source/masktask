[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[FileUpload2]
name     = logofile
;maxsize  = 1000
type     = image/gif
filemode = 0644

noFileError/whether/ = ファイルを指定してください
typeError = 使用するロゴ画像はgif形式にしてください

[Token]
mode = check,build
name = LogoEditToken

[Validate]

[DIContainer]
filename=dicon.ini
[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
LogoFile   = ref:FileUpload2
OutlookLogoResizer = ref:AdminConfigOutlookLogoLogic

[View]
success    = admin/config/logo/done.html
input      = admin/config/logo/index.html
error      = admin/config/error.html
error2      = admin/config/logo/error.html
invalidToken = admin/config/error.html
upload     = admin/config/logo/index.html

