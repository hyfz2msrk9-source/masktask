[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = FileEditToken

[Convert]
file_upload_limit.trim =

[Validate]
; file_upload_limit.required = "1,最大アップロード数が入力されていません。"
; file_upload_limit.integer = "1,最大アップロード数は整数で入力してください。"
; file_upload_limit.range = "1,最大アップロード数は1〜9999の範囲で登録してください,1,9999"

[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups

[View]
success    = admin/config/upload/done.html
input      = admin/config/upload/index.html
error = admin/config/error.html
invalidToken = admin/config/error.html
