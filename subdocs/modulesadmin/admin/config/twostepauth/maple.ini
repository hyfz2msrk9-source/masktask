[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = TwoStepAuthConfigEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
CommonList  = ref:CommonList
token = ref:Token

[View]
success = admin/config/twostepauth/index.html
error = error/error.html