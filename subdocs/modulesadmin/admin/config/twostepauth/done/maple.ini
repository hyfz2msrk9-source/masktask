[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = TwoStepAuthConfigEditToken

[Convert]
two_step_auth_confirm_span.trim =
two_step_auth_confirm_span.tohalf =

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
DtoAdminTwostepauth  =

[Action]
session               = ref:Session
DtoConfigs            = ref:DtoConfigs
DtoLog                = ref:DtoLog
MdbConfigs            = ref:MdbConfigs
MdbLog                = ref:MdbLog
MdbTwostepauthbrowser = ref:MdbTwostepauthbrowser
MdbUser               = ref:MdbUser
CommonList  = ref:CommonList
MdbAdminTwostepauth = ref:MdbAdminTwostepauth
MdbBackupcode = ref:MdbBackupcode
MdbAdminTwostepauthBrowser = ref:MdbAdminTwostepauthBrowser
token = ref:Token

[View]
success      = admin/config/twostepauth/done.html
input        = admin/config/twostepauth/index.html
error        = admin/error.html
invalidToken = admin/config/error.html
