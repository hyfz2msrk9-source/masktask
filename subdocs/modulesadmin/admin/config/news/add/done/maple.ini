;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = NewsAddToken

[Convert]
open_at.trim =
expiry_at.trim =
title.trim =
title_en.trim =
title_cn.trim =
title_tcn.trim =

[Validate]
open_at_year,open_at_month,open_at_day.required   = "1,公開日付を入力してください。"
open_at_year,open_at_month,open_at_day.date       = "1,公開日付を正しく入力してください。"
expiry_at_year,expiry_at_month,expiry_at_day.date = "1,公開期限を正しく入力してください。"

title.required      = "1,タイトルを入力してください。"
title.mbmaxlength   = "1,タイトルを40文字以内で入力してください。,40"
;title_en.required   = "1,タイトル（英語）を入力してください。"
title_en.mbmaxlength= "1,タイトル（英語）を40文字以内で入力してください。,40"
;title_cn.required   = "1,タイトル（簡体字）を入力してください。"
;title_cn.mbmaxlength= "1,タイトル（簡体字）を40文字以内で入力してください。,40"
;title_tcn.required   = "1,タイトル（繁体字）を入力してください。"
;title_tcn.mbmaxlength= "1,タイトル（繁体字）を40文字以内で入力してください。,40"

body.required       = "1,本文を入力してください。"
body.mbmaxlength    = "1,本文を300文字以内で入力してください。,300"
;body_en.required    = "1,本文（英語）を入力してください。"
body_en.mbmaxlength = "1,本文（英語）を300文字以内で入力してください。,300"
;body_cn.required    = "1,本文（簡体字）を入力してください。"
;body_cn.mbmaxlength = "1,本文（簡体字）を300文字以内で入力してください。,300"
;body_tcn.required    = "1,本文（繁体字）を入力してください。"
;body_tcn.mbmaxlength = "1,本文（繁体字）を300文字以内で入力してください。,300"

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoNews =

[Action]
session = ref:Session
DtoNews = ref:DtoNews
MdbNews = ref:MdbNews
DtoLog  = ref:DtoLog
MdbLog  = ref:MdbLog

[View]
success      = admin/config/news/add/done.html
input        = admin/config/news/add/form.html
invalidToken = admin/config/news/add/done.html 