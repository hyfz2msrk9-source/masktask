[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = NewsEditToken

[Validate]
user_kp_news_flg.required = "1,ユーザ画面お知らせ表示の値が入力されていません。"
user_kp_news_flg.range = "1,ユーザ画面お知らせ表示は0または1でご入力ください。,0,1"
admin_kp_news_flg.required = "1,管理画面お知らせ表示の値が入力されていません。"
admin_kp_news_flg.range = "1,管理画面お知らせ表示は0または1でご入力ください。,0,1"

[DIContainer]
filename=dicon.ini

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoNews    = ref:DtoNews
MdbNews    = ref:MdbNews
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog

[View]
success    = admin/config/done.html
input      = admin/config/news/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html
