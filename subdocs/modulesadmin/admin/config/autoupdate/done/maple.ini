;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = MailUpdateToken


[Convert]
mailaddr.trim = 
mailaddr.tohalf =

[Validate]
;mailaddr.required = "1,メールアドレスを入力してください。"
mailaddr.mail = "1,メールアドレスが不正です。"
mailaddr.maxlength = "1,メールアドレスを200文字以内で入力してください。,200"

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoConfigs =

[InjectRequest]
DtoConfigs =

[Action]
session = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog  = ref:DtoLog
MdbLog  = ref:MdbLog

[View]
success      = admin/config/autoupdate/done.html
input        = admin/config/autoupdate/index.html 
error        = admin/config/error.html
invalidToken = admin/config/error.html

