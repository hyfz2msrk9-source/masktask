[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ViewEditToken

[Convert]

[Validate]
admin_tel_number.maxlength = "1,電話番号の文字は20文字以内で入力してください。,20"

admin_mail_to_addr.mail       = "1,メールアドレス（To）が不正です。"
admin_mail_to_addr.maxlength = "1,メールアドレス（To）は255文字以内で入力してください。,255"

admin_mail_cc_addr.mails       = "1,メールアドレス（Cc）が不正です。"
admin_mail_cc_addr.maxlength = "1,メールアドレス（Cc）は255文字以内で入力してください。,255"


[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups

[View]
success    = admin/config/view/done.html
input      = admin/config/view/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html
