[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = ViewEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
token = ref:Token

[View]
success    = admin/config/view/index.html
