[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = AccountlockEditToken

;[Convert]

[DIContainer]
filename=dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
CommonList  = ref:CommonList
TemplateLogic = ref:TemplateLogic
token = ref:Token

[View]
success      = admin/config/accountlock/done.html
input        = admin/config/accountlock/index.html
error        = admin/config/error.html
invalidToken = admin/config/error.html
