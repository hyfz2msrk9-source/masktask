[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = UserEditToken

[Convert]
send_mail_limit.trim =
file_send_limit.trim =

[Validate]
user_delete_limit_dt.required = "1,未ログインのアカウント削除日数が入力されていません。"
user_delete_limit_dt.numeric = "1,未ログインのアカウント削除日数は数値のみを入力してください。"
user_delete_limit_dt.range = "1,未ログインのアカウント削除日数は0〜999の範囲で登録してください。,0,999"

[DIContainer]
filename=dicon.ini
[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups

[View]
success    = admin/config/user/done.html
input      = admin/config/user/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html
