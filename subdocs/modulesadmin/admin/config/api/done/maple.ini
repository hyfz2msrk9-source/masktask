;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ApiEditToken

[Convert]
api_flg.trim =

[Validate]
api_flg.required   = "1,申し訳ございませんが、データ登録中にエラーが発生したため、処理を中断しました。<br />再度、編集をお願い致します。"
api_flg.integer    = "1,申し訳ございませんが、データ登録中にエラーが発生したため、処理を中断しました。<br />再度、編集をお願い致します。"
api_flg.range      = "1,申し訳ございませんが、データ登録中にエラーが発生したため、処理を中断しました。<br />再度、編集をお願い致します。,0,1"

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session          = ref:Session
MdbConfigs       = ref:MdbConfigs
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog
CommonList  = ref:CommonList

[View]
success      = admin/config/api/done.html
error        = admin/error.html
input        = admin/config/error.html
invalidToken = admin/config/error.html
