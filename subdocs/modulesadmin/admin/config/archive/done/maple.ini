;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ArchiveEditToken

[Convert]
archive_storage_span.trim =
archive_storage_span.tohalf =
export_storage_span.trim =
export_storage_span.tohalf =

[Validate]
archive_storage_span.required   = "1,保管期間設定が入力されていません。"
archive_storage_span.integer    = "1,保管期間設定は整数で入力してください。"
archive_storage_span.range      = "1,保管期間設定は0〜9998の範囲で登録してください。,0,9999"


evi_archive_autonotice.integer  = "1,アーカイブの警告メールを送信する容量設定は整数で入力してください。"
evi_archive_autonotice.range    = "1,アーカイブの警告メールを送信する容量設定は0～100の範囲で入力してください。,0,100"


evi_archive_autodelete.integer  = "1,アーカイブのデータを削除する容量設定は整数で入力してください。"
evi_archive_autodelete.range    = "1,アーカイブのデータを削除する容量設定は0～100の範囲で入力してください。,0,100"


evi_archive_export_autonotice.integer   = "1,エクスポートの警告メールを送信する容量設定は整数で入力してください。"
evi_archive_export_autonotice.range     = "1,エクスポートの警告メールを送信する容量設定は0～100の範囲で入力してください。,0,100"


;evi_archive_export_autodelete.numeric   = "1,エクスポートのデータを削除する容量設定は数値のみを入力してください。"
evi_archive_export_autodelete.integer   = "1,エクスポートのデータを削除する容量設定は整数で入力してください。"
evi_archive_export_autodelete.range     = "1,エクスポートのデータを削除する容量設定は0～100の範囲で入力してください。,0,100"

export_storage_span.required    = "1,エクスポートファイル保管期間設定が入力されていません。"
;export_storage_span.numeric     = "1,エクスポートファイル保管期間設定は数値のみを入力してください。"
export_storage_span.integer     = "1,エクスポートファイル保管期間設定は整数で入力してください。"
export_storage_span.range       = "1,エクスポートファイル保管期間設定は0〜9998の範囲で登録してください。,0,9999"
archive_notice_addr.mbmaxlength = "1,メールアドレスを255文字以内で入力してください。,255"
archive_notice_addr.mails       = "1,メールアドレスを正しく入力してください。"

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session          = ref:Session
MdbConfigs       = ref:MdbConfigs
MdbArchiveFile   = ref:MdbArchiveFile
MdbArchiveExport = ref:MdbArchiveExport
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog

[View]
success      = admin/config/archive/done.html
input        = admin/config/archive/index.html
error        = admin/config/error.html
invalidToken = admin/config/error.html
