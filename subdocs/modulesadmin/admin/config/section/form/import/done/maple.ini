[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,remove
name = SectionFormImportToken

[Convert]

[Validate]

[FileUpload]
name = file
maxsize     = 2097152
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename=dicon.ini

[InjectSession]
DtoSection =

[InjectRequest]
DtoSection =

[Action]
session               = ref:Session
fileUpload            = ref:FileUpload
DtoSection            = ref:DtoSection
MdbSection            = ref:MdbSection
DtoSectionusers       = ref:DtoSectionusers
MdbSectionusers       = ref:MdbSectionusers
DtoUser               = ref:DtoUser
MdbUser               = ref:MdbUser
DtoLog                = ref:DtoLog
MdbLog                = ref:MdbLog
SectionLogic          = ref:SectionLogic
MdbGroupsusers        = ref:MdbGroupsusers
GroupsusersLogic      = ref:GroupsusersLogic
MdbUpload             = ref:MdbUpload

[View]
error   = admin/config/section/form_import.html
upload  = admin/config/section/form_import.html
success = admin/config/section/form_import_done.html
invalidToken = admin/config/section/form_import.html
