[Auth]
template = "common/null.html"

;[GlobalFilter]

[Session]
mode = start

[Token]
mode = check
name = SectionToken

[Convert]
section_name.trim =

[Validate]
section_name.required  = "1,部署グループ名を入力してください。"
section_name.maxlength = "1,部署グループ名が長すぎます。,200"

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoSection =
DtoSectionusers =

[Action]
session         = ref:Session
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser
DtoSection      = ref:DtoSection
MdbSection      = ref:MdbSection
DtoSectionusers = ref:DtoSectionusers
MdbSectionusers = ref:MdbSectionusers
DtoGroupsusers  = ref:DtoGroupsusers
MdbGroupsusers  = ref:MdbGroupsusers
SectionLogic    = ref:SectionLogic
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog
GroupsusersLogic= ref:GroupsusersLogic
MdbUpload       = ref:MdbUpload
MdbAdminuser	= ref:MdbAdminuser

[View]
input = admin/config/section/errorlist.html
invalidToken = admin/config/section/alert_token.html