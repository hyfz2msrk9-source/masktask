[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ClientEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
DtoClientAuth =

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog = ref:DtoLog
MdbLog = ref:MdbLog
token = ref:Token

[View]
success    = admin/config/clientauth/done.html
input = admin/config/clientauth/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html