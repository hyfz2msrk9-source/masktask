[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = ClientEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
token      = ref:Token

[View]
success    = admin/config/clientauth/index.html
error      = admin/config/clientauth/error.html