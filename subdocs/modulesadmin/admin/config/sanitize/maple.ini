[GlobalFilter]

[AuthLevel]
authlevel = 5

[Token]
mode = build
name = SanitizeEditToken

[Session]
mode = start

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
token = ref:Token

[View]
success    = admin/config/sanitize/index.html
error        = admin/error.html
