;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = DomainImportToken

;[Convert]

[FileUpload]
name = file
maxsize     = 2097152
;type        = text/csv, application/octet-stream,text/x-comma-separated-values
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
;typeError   = カンマ区切りCSVファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
fileUpload  = ref:FileUpload
MdbUser     = ref:MdbUser
DtoDomain   = ref:DtoDomain
MdbDomain   = ref:MdbDomain
DomainLogic = ref:DomainLogic
session     = ref:Session
MdbLog      = ref:MdbLog
DtoLog      = ref:DtoLog

[View]
success      = "admin/config/domain/import/done.html"
invalidToken = "admin/config/domain/import/done.html"
upload       = "admin/config/domain/import/form.html"
