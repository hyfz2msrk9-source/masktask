;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Auth]
template = "common/json_empty.html"

[Session]
mode = start

[Token]
mode = check
name = DomainToken

;[Convert]

[Validate]
user_id.required     = "0,ユーザIDを入力してください。"
user_id.numeric      = "0,不正なパラメータが入力されています。"
list_type.required   = "0,リスト種別を入力してください。"
list_type.numeric    = "0,不正なパラメータが入力されています。"
domain_name.required = "1,ドメインを入力してください。"

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoDomain =
DtoUser =

[Action]
Session     = ref:Session
DtoDomain   = ref:DtoDomain
MdbDomain   = ref:MdbDomain
DomainLogic = ref:DomainLogic
DtoUser	    = ref:DtoUser
MdbUser	    = ref:MdbUser
DtoLog      = ref:DtoLog
MdbLog      = ref:MdbLog

[View]
success      = "admin/config/domain/json_add.html"
input        = "admin/config/domain/json_error.html"
invalidToken = "admin/config/domain/json_token.html"