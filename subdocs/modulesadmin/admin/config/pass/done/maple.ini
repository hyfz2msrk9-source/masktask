[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = PassEditToken

[Convert]
user_passmustdts.trim =
admin_passmustdts.trim =
pass_min.trim =
pass_max.trim =
user_passmustdts.tohalf =
admin_passmustdts.tohalf =
pass_min.tohalf =
pass_max.tohalf =
smspass_min.trim =
smspass_max.trim =
smspass_min.tohalf =
smspass_max.tohalf =

[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups
CommonList  = ref:CommonList
token      = ref:Token

[View]
success    = admin/config/pass/done.html
input      = admin/config/pass/index.html
error      = admin/config/error.html
invalidToken = admin/config/error.html
