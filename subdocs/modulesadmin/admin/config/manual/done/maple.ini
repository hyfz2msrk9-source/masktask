[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ManualEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoLog	   = ref:DtoLog
MdbLog	   = ref:MdbLog

[View]
input	     = admin/config/filedel/index.html
success      = admin/config/filedel/done/done.html
invalidToken = admin/config/error.html
