[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = DeliveryEditToken

[Convert]
delivery_mail_limit.trim =
file_delivery_limit.trim =

[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog = ref:DtoLog
MdbLog = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups = ref:DtoGroups
MdbGroups = ref:MdbGroups
token     = ref:Token

[View]
success = admin/config/delivery/done.html
error = admin/config/delivery/error.html
input = admin/config/delivery/index.html
data = admin/config/error.html
invalidToken = admin/config/error.html
