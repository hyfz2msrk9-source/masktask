[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = GatheringEditToken

[Convert]
gathering_mail_limit.trim =
gathering_file_limit.trim =

[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog = ref:DtoLog
MdbLog = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups = ref:DtoGroups
MdbGroups = ref:MdbGroups
token = ref:Token

[View]
success = admin/config/gathering/done.html
error = admin/config/gathering/error.html
input = admin/config/gathering/index.html
data = admin/config/error.html
invalidToken = admin/config/error.html
