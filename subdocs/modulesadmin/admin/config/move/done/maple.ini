[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = MoveEditToken

[Convert]

[Validate]

[DIContainer]
filename=dicon.ini
[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbMchoice = ref:MdbMchoice
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups

[View]
success    = admin/config/move/done.html
input      = admin/config/move/index.html
invalidToken = admin/config/error.html