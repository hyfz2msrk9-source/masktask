[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = MoveEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoGroups  = ref:DtoGroups
MdbGroups  = ref:MdbGroups
MdbMchoice = ref:MdbMchoice

[View]
success    = admin/config/move/index.html
