;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = ContinuousloginEditToken

;[Convert]

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
TemplateLogic = ref:TemplateLogic
token = ref:Token

[View]
success = admin/config/continuouslogin/index.html
error = admin/config/error.html
