[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = ContinuousloginEditToken

;[Convert]

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
AdminUserLogic = ref:AdminUserLogic
TemplateLogic = ref:TemplateLogic
token = ref:Token

[View]
success         = admin/config/continuouslogin/done.html
input           = admin/config/continuouslogin/index.html
error           = admin/config/error.html
invalidToken    = admin/config/error.html
