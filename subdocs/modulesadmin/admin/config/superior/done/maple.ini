[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = SuperiorEditToken

[Convert]

[Validate]

[DIContainer]
filename=dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
DtoConfigs = ref:DtoConfigs
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
token = ref:Token

[View]
success      = admin/config/superior/done.html
input        = admin/config/superior/index.html
error        = admin/config/error.html
invalidToken = admin/config/error.html
