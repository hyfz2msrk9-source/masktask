[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,build
name = SamlAuthenticationEditToken

[Convert]
saml_authentication_issuer.trim =
saml_authentication_saml_endpoint.trim =
saml_authentication_cert.trim =

[Validate]
saml_authentication_issuer.required   = "1,Issuer URLが入力されていません。"
saml_authentication_issuer.mbmaxlength = "1,Issuer URLは100文字以内で入力してください。,100"

saml_authentication_saml_endpoint.required   = "1,SAML 2.0 Endpoint (HTTP)が入力されていません。"
saml_authentication_saml_endpoint.mbmaxlength = "1,SAML 2.0 Endpoint (HTTP)は100文字以内で入力してください。,100"

saml_authentication_cert.required   = "1,X.509 Certificateが入力されていません。"
saml_authentication_cert.mbmaxlength = "1,X.509 Certificateは2000文字以内で入力してください。,2000"

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session    = ref:Session
MdbConfigs = ref:MdbConfigs
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
AdminUserLogic = ref:AdminUserLogic
CommonList  = ref:CommonList

[View]
success         = admin/config/saml/authentication/done.html
input           = admin/config/saml/authentication/index.html
error           = admin/config/error.html
invalidToken    = admin/config/error.html
