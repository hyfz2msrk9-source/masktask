[GlobalFilter]

[Session]
mode = start

[Token]
mode = make
name = SuperiorEditToken

[Convert]

[Validate]
user_id.numeric = "1,不正IDが指定されています。"

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
DtoUser =

[Action]
session         = ref:Session
MdbUserSuperior = ref:MdbUserSuperior
DtoUserSuperior = ref:DtoUserSuperior
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser

[View]
success = admin/superior/edit/form.html
error   = admin/superior/edit/error.html
input = admin/error.html
