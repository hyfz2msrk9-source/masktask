[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = SuperiorEditToken

[Convert]

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoUser =

[InjectRequest]

[Action]
session         = ref:Session
MdbUserSuperior = ref:MdbUserSuperior
DtoUserSuperior = ref:DtoUserSuperior
MdbSuperiorMulti = ref:MdbSuperiorMulti
MdbSuperiorSend = ref:MdbSuperiorSend
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser
UserLogic   = ref:UserLogic
adminuserLogic = ref:adminuserLogic
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog

[View]
success = admin/superior/edit/done.html
error   = admin/superior/edit/error.html
invalidToken = admin/error.html
input = admin/superior/edit/form.html
