[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = SuperiorImportToken

[Convert]

[FileUpload]
name = file
maxsize     = 2097152
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session         = ref:Session
fileUpload      = ref:FileUpload
MdbUserSuperior = ref:MdbUserSuperior
DtoUserSuperior = ref:DtoUserSuperior
MdbSuperiorMulti = ref:MdbSuperiorMulti
MdbSuperiorSend = ref:MdbSuperiorSend
UserLogic   = ref:UserLogic
AdminuserLogic = ref:AdminuserLogic
SuperiorLogic   = ref:SuperiorLogic
DtoUser         = ref:DtoUser
MdbUser         = ref:MdbUser
DtoLog          = ref:DtoLog
MdbLog          = ref:MdbLog

[View]
success      = admin/superior/import/done.html
upload       = admin/superior/import/form.html
invalidToken = admin/error.html
error        = admin/superior/import/error.html
