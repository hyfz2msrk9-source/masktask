[Auth]
stop = 1

[PassCheck]
stop = 1

[Session]
mode = start

[Token]
mode = check,build
name = AdminLoginTwoStepAuthToken

[DIContainer]
filename = dicon.ini

[Action]
session            = ref:Session
TwostepauthOpenssl   = ref:TwostepauthOpenssl
TwostepauthLogic = ref:TwostepauthLogic
MdbAdminTwostepauth= ref:MdbAdminTwostepauth
MdbBackupcode = ref:MdbBackupcode
MdbAdminTwostepauthBrowser = ref:MdbAdminTwostepauthBrowser
DtoLog = ref:DtoLog

[View]
error        = error/error-mini.html
invalidToken = error/error-mini.html
input_app        = admin/twostepauth/app_code_check.html
input_mail        = admin/twostepauth/mail_login_check.html
success      = action:admin_user
