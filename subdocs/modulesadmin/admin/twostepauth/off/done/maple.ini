[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = AdminOffTwoStepAuthToken

[DIContainer]
filename = dicon.ini

[Action]
session               = ref:Session
MdbAdminTwostepauth= ref:MdbAdminTwostepauth
TwostepauthLogic      = ref:TwostepauthLogic
MdbBackupcode = ref:MdbBackupcode
DtoLog = ref:DtoLog
MdbAdminTwostepauthBrowser =ref:MdbAdminTwostepauthBrowser

[View]
error        = error/error.html
invalidToken = admin/error.html
input        = admin/twostepauth/do_off.html
success      = admin/twostepauth/done.html
