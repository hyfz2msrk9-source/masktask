[GlobalFilter]

[Session]
mode = start
[Token]

[Convert]

[Validate]
deldts.required = "1,ファイルを削除する日数を入力してください。"
deldts.numeric = "1,ファイルを削除する日数は、半角数字で入力してください。"
deldts.minvalue = "1,ファイルを削除する日数は、1-999で入力してください。,1"
deldts.maxvalue = "1,ファイルを削除する日数は、1-999で入力してください。,999"

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
DtoLog =

[Action]
session        = ref:Session
Mdbdeletedt    = ref:Mdbdeletedt
DtoLog         = ref:DtoLog
MdbLog         = ref:MdbLog
ListLogic      = ref:ListLogic

[View]
success  = "admin/log/index.html"
input = "admin/log/index.html"