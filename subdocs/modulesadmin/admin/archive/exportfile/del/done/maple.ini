;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,remove
name = ExportDelToken

;[Convert]

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoArchiveExport =

[Action]
session          = ref:Session
DtoArchiveExport = ref:DtoArchiveExport
MdbArchiveExport = ref:MdbArchiveExport
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog

[View]
success      = admin/archive/exportfile/del/done.html
invalidToken = admin/archive/exportfile/del/done.html
error        = admin/error.html