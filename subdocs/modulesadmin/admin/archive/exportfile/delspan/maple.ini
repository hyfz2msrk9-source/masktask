;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = ExportDelspanToken

[Convert]
startYear,startMonth,startDay.tohyphen = start
endYear,endMonth,endDay.tohyphen       = end

[Validate]
startYear,startMonth,startDay.required = "1,削除開始日付を選択してください。"
endYear,endMonth,endDay.required       = "1,削除終了日付を選択してください。"	
startYear,startMonth,startDay.date     = "1,削除開始日付を正しく選択してください。"
endYear,endMonth,endDay.date           = "1,削除終了日付を正しく選択してください。"

[DIContainer]
filename = dicon.ini

;[InjectSession]

[InjectRequest]
DtoArchiveExport =

[Action]
session          = ref:Session
DtoArchiveExport = ref:DtoArchiveExport
MdbArchiveExport = ref:MdbArchiveExport

[View]
success = admin/archive/exportfile/delspan/confirm.html
input   = admin/archive/exportfile/index.html
error   = admin/archive/exportfile/index.html