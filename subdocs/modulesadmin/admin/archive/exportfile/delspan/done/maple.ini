;[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,remove
name = ExportDelspanToken

;[Convert]

[DIContainer]
filename = dicon.ini

;[InjectSession]

;[InjectRequest]

[Action]
session          = ref:Session
DtoArchiveExport = ref:DtoArchiveExport
MdbArchiveExport = ref:MdbArchiveExport
ArchiveLogic     = ref:ArchiveLogic
DtoLog           = ref:DtoLog
MdbLog           = ref:MdbLog

[View]
success      = admin/archive/exportfile/delspan/done.html
invalidToken = admin/archive/exportfile/delspan/done.html
error        = admin/error.html