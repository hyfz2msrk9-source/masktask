[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = build
name = AdminAddToken

[Convert]
account.trim =
account.tohalf =
memo.trim =

[Validate]
account.required = "1,ご希望のアカウントを入力してください。"
account.accountrule = "1,アカウントを半角英数字2-30文字以内で入力してください。"
account.minlength = "1,アカウントを半角英数字2-30文字以内で入力してください。,2"
account.maxlength = "1,アカウントを半角英数字2-30文字以内で入力してください。,30"
password.required = "1,ご希望のパスワードを入力してください。"
;password.minlength = "1,パスワードは4文字以上で入力してください。,4"
password,re_password.compare = "1,パスワードが同じではありません。"
level.range         = "1,権限の値が不正です。,3,5"
memo.mbmaxlength = "1,備考を全角50文字以内で入力してください。,50"

[DIContainer]
filename =dicon.ini

[InjectSession]

[InjectRequest]
DtoAdminUser =

[Action]
session    = ref:Session
MdbAdminUser  = ref:MdbAdminUser
DtoAdminUser  = ref:DtoAdminUser
AdminLogic    = ref:AdminLogic
MdbConfigs    = ref:MdbConfigs

[View]
success  = "admin/admin/add/confirm.html"
error  = "admin/admin/add/error.html"
input =  "admin/admin/add/form.html"
