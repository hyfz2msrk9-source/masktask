[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start
[Token]
mode = build
name = FileDelToken
[Convert]

[Validate]
clear_y,clear_m,clear_d.date = "1,指定日付は不正です。"
[DIContainer]
filename =dicon.ini

[InjectSession]

[InjectRequest]
fileDto =
[Action]
session    = ref:Session
ListLogic  = ref:ListLogic
fileDto    = ref:fileDto
fileLogic  = ref:fileLogic
MdbCollect = ref:MdbCollect
MdbUpload  = ref:MdbUpload
MdbConfigs = ref:MdbConfigs

[View]
success  = "admin/config/filedel/del/confirm.html"
input = "admin/config/filedel/index.html"