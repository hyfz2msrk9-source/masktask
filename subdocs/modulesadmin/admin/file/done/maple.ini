[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,remove
name = FileDelToken

[Convert]

[Validate]
clear_y,clear_m,clear_d.date = "1,指定日付は不正です。"

[DIContainer]
filename =dicon.ini

[InjectSession]

[InjectRequest]
fileDto =
[Action]
session    = ref:Session
ListLogic  = ref:ListLogic
fileDto    = ref:fileDto
fileLogic  = ref:fileLogic
MdbCollect = ref:MdbCollect
MdbUpload  = ref:MdbUpload
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbConfigs = ref:MdbConfigs;

[View]
success  = "admin/config/filedel/del/done.html"
input = "admin/config/filedel/index.html"
invalidToken = "admin/config/filedel/del/done.html"