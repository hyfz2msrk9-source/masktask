[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,remove
name = UserCsvToken

[Convert]

[Validate]

[FileUpload]
name = file
maxsize     = 2097152
;type        = text/csv, application/octet-stream,text/x-comma-separated-values
filemode    = 0666
sizeError   = ファイルが大きすぎます。2M以内のファイルを指定してください。
;typeError   = カンマ区切りCSVファイルを指定してください。
noFileError = ファイルを指定してください。

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session    = ref:Session
fileUpload = ref:FileUpload
DtoUser    = ref:DtoUser
UserLogic  = ref:UserLogic
User2Logic = ref:User2Logic
MdbUser    = ref:MdbUser
UserDto    = ref:UserDto
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbConfigs = ref:MdbConfigs
DtoConfigs = ref:DtoConfigs
MdbGroups  = ref:MdbGroups
MdbGroupsUsers  = ref:MdbGroupsUsers
MdbSection = ref:MdbSection
MdbSectionusers = ref:MdbSectionusers
MdbGroupsadminusers = ref:MdbGroupsadminusers
MdbUserSuperior = ref:MdbUserSuperior
DtoUserSuperior = ref:DtoUserSuperior
MdbUpload  = ref:MdbUpload
DtoUpload  = ref:DtoUpload
MdbCollect = ref:MdbCollect
DtoCollect = ref:DtoCollect
MdbFolder  = ref:MdbFolder
DtoFolder  = ref:DtoFolder
MdbTag     = ref:MdbTag
DtoTag     = ref:DtoTag
MdbAddr    = ref:MdbAddr
DtoAddr    = ref:DtoAddr
MdbAddrGroup   = ref:MdbAddrGroup
DtoAddrGroup   = ref:DtoAddrGroup
MdbAddrGroupUsers   = ref:MdbAddrGroupUsers
MdbSign    = ref:MdbSign
DtoSign    = ref:DtoSign
MdbTemplate   = ref:MdbTemplate
DtoTemplate   = ref:DtoTemplate
MdbResendMail = ref:MdbResendMail
DtoResendMail = ref:DtoResendMail
CapacityLogic = ref:CapacityLogic
MdbDomain = ref:MdbDomain
DtoDomain = ref:DtoDomain
MdbAdminuser = ref:MdbAdminuser
DtoAdminuser = ref:DtoAdminuser
MdbReportmail = ref:MdbReportmail
CommonList  = ref:CommonList
MdbSuperiorSend = ref:MdbSuperiorSend
MdbSuperiorMulti = ref:MdbSuperiorMulti
MdbDelivery = ref:MdbDelivery

[View]
success = "admin/user/csv/done.html"
upload  = "admin/user/csv/done.html"
invalidToken = "admin/error.html"
