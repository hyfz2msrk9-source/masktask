start_at_month.numeric = "1,開始日（月）を数字のみで入力してください。"
start_at_month.minvalue = "1,開始日（月）を1以上で入力してください。,1"
start_at_month.maxvalue = "1,開始日（月）を12以下で入力してください。,12"
start_at_day.numeric = "1,開始日（日）を数字のみで入力してください。"
start_at_day.minvalue = "1,開始日（日）を1以上で入力してください。,1"
start_at_day.maxvalue = "1,開始日（日）を31以下で入力してください。,31"

end_at_year.numeric = "1,有効期限（年）を数字のみで入力してください。"
