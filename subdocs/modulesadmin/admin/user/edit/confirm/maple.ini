max_up_size.required = "1,ご希望のアップロード容量を0MB以上で入力してください。"
max_up_size.numeric = "1,ご希望のアップロード容量を数字のみで入力してください。"

file_delete_limit_dt.required = "1,定期削除の個別設定日数を0以上で入力してください。"
file_delete_limit_dt.numeric = "1,定期削除の個別設定日数を数字のみで入力してください。"
