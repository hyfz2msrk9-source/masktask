end_at_month.numeric = "1,有効期限（月）を数字のみで入力してください。"
end_at_month.minvalue = "1,有効期限（月）を1以上で入力してください。,1"
end_at_month.maxvalue = "1,有効期限（月）を12以下で入力してください。,12"
end_at_day.numeric = "1,有効期限（日）を数字のみで入力してください。"
end_at_day.minvalue = "1,有効期限（日）を1以上で入力してください。,1"
end_at_day.maxvalue = "1,有効期限（日）を31以下で入力してください。,31"

stop_flg.match = "1,状態の値を正しく選択してください。,^[01]$"
memo.maxlength = "1,メモの文字が長すぎます。,255"

account_lock_flg.match = "1,アカウントロックチェックボックスに不正な入力が見つかりました。,^[01]$"

