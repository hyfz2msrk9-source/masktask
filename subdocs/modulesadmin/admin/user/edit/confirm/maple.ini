;passwd.minlength = "1,パスワードを4-16文字以内で入力してください。,4"
;passwd.maxlength = "1,パスワードを4-16文字以内で入力してください。,16"
passwd,re_passwd.compare = "1,パスワードが同じではありません。"

user_name.required = "1,氏名を入力してください。"
user_name.maxlength = "1,氏名の文字が長すぎます。,255"
user_kana.maxlength = "1,氏名(カナ)の文字が長すぎます。,255"

mailaddr.required = "1,メールアドレスを入力してください。"
mailaddr.mail = "1,メールアドレスが不正です。"
mailaddr.maxlength = "1,メールアドレスを255文字以内で入力してください。,255"

max_file_size.required = "1,ご希望の基本容量を入力してください。"
