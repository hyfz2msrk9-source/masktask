auth_type,google_mail_address.whichrequired = "1,ご希望のアカウントを入力してください。,1"
google_mail_address.mail                    = "1,アカウントが正しくありません。メールアドレスの形式で入力してください。"
auth_type,google_mail_address.whichmaxlength = "1,アカウントを半角英数字255文字以内で入力してください。,255,1"

auth_type,saml_mail_address.whichrequired   = "1,ご希望のアカウントを入力してください。,2"
