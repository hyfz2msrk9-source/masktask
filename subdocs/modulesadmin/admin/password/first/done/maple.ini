[GlobalFilter]

[Session]
mode = start

[PassCheck]
stop = 1

[Validate]
account.required = "1,アカウントを入力してください。"
account.minlength = "1,アカウントを半角英数字2-30文字以内で入力してください。,2"
account.maxlength = "1,アカウントを半角英数字2-30文字以内で入力してください。,30"
old.required = "1,現在のパスワードを入力してください。"
new1.required = "1,新しいパスワードを入力してください。"
new2.required = "1,新しいパスワード（確認）を入力してください。"
new1,new2.compare = "1,新しいパスワードと新しいパスワード（確認）には、同じパスワードを入力してください。"

[DIContainer]
filename = dicon.ini

[InjectSession]
DtoAdminuser =

[InjectRequest]
AdminPassEntry =

[Action]
session    = ref:Session
DtoAdminuser   = ref:DtoAdminuser
MdbAdminuser   = ref:MdbAdminuser
AdminPassEntry = ref:AdminPassEntry
DtoLog     = ref:DtoLog
MdbLog     = ref:MdbLog
MdbConfigs = ref:MdbConfigs
AdminLogic     = ref:AdminLogic
DtoUser = ref:DtoUser
MdbUser = ref:MdbUser
UserLogic = ref:UserLogic


[View]
success = admin/login/login.html
input   = admin/password/first_change.html
invalidToken = admin/password/tokenerr.html
