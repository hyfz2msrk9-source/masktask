[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,build
name = PasswordEditToken

[Convert]

[Validate]
old.required = "1,現在のパスワードを入力してください。"
new1.required = "1,新しいパスワードを入力してください。"
;new1.minlength = "1,新しいパスワードは、4文字以上で入力してください。,4"
;new1.maxlength = "1,新しいパスワードは、4文字以上・16文字以内にしてください。,16"
new1,new2.compare = "1,新しいパスワードと新パスワード（確認）には、同じパスワードを入力してください。"

[DIContainer]
filename =dicon.ini

[InjectSession]
DtoAdminuser =

[InjectRequest]
AdminPassEntry =

[Action]
session        = ref:Session
DtoAdminuser   = ref:DtoAdminuser
MdbAdminuser   = ref:MdbAdminuser
AdminPassEntry = ref:AdminPassEntry
DtoLog         = ref:DtoLog
MdbLog         = ref:MdbLog
DtoConfigs     = ref:DtoConfigs
MdbConfigs     = ref:MdbConfigs
AdminLogic     = ref:AdminLogic

[View]
success    = admin/password/done.html
input      = admin/password/form.html
invalidToken = admin/password/tokenerr.html
