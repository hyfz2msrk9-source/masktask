[GlobalFilter]

[Session]
mode = start

[Token]
mode = check,remove
name = TemplateEditToken

[Convert]

[DIContainer]
filename =dicon.ini

[InjectSession]

[InjectRequest]

[Action]
session       = ref:Session
DtoLog         = ref:DtoLog
MdbLog         = ref:MdbLog
TemplateLogic = ref:TemplateLogic

[View]
success    = admin/template/done.html
invalidToken =admin/template/done.html
input      = admin/template/form.html
error      = action:admin_template
