[GlobalFilter]
Session=
DBAccess =
AccessLimit =
ClientAuth =
Auth =
PassCheck =

[Session]
mode = start
savePath = "SESSION_SAVEPATH"
secure   = "SESSION_SECURE"
regenerateId = true
samesite = "Strict"

[DBAccess]
dbtype = "DB_TYPE"
dbhost = "DB_HOST"
dbname = "DB_NAME"
dbuser = "DB_USER"
dbpass = "DB_PASS"

[Auth]
db = ref:DBAccess
table = AdminUser
user = account
passwd = password
id = admin_id
level = level
template = "admin/login/loginerror.html"
sessions = "password_change_dt"

[AccessLimit]
area     = 1
template = "error/access_limit.html"

[ClientAuth]
template = "error/access_limit.html"

[PassCheck]
template = "admin/password/must.html"
