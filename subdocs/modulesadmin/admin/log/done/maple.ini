[GlobalFilter]

[AuthLevel]
authlevel = 5

[Session]
mode = start

[Token]
mode = check,remove
name = LogDelToken

[Convert]

[Validate]

[DIContainer]
filename = dicon.ini

[InjectSession]

[InjectRequest]
DtoAdminLog =

[Action]
session        = ref:Session
DtoAdminLog    = ref:DtoAdminLog
DtoLog         = ref:DtoLog
MdbLog         = ref:MdbLog

[View]
success  = admin/log/done.html
error = admin/log/error.html
invalidToken = admin/log/tokenerr.html
