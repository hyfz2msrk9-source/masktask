[GlobalFilter]

[AuthLevel]
authlevel = 5

[Auth]

[Session]
mode = start

[Token]
mode = check,remove
name = LogRegularDelToken

[DIContainer]
filename = dicon.ini

[Action]
DtoLog       = ref:DtoLog
MdbLog       = ref:MdbLog
UserLogic    = ref:UserLogic
MdbUpload    = ref:MdbUpload
DtoUpload    = ref:DtoUpload
MdbCollect   = ref:MdbCollect
DtoCollect   = ref:DtoCollect
MdbFolder    = ref:MdbFolder
DtoFolder    = ref:DtoFolder
MdbMchoice   = ref:MdbMchoice
MdbDownload  = ref:MdbDownload
MdbUser      = ref:MdbUser
MdbAdminuser = ref:MdbAdminuser

[View]
success = admin/log/done.html
error = admin/log/error.html
invalidToken = admin/log/tokenerr.html